name: Sync external posts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:content
      - id: sync
        run: pnpm content:sync
      - if: steps.sync.outputs.changed == 'true'
        run: pnpm build
      - name: Commit changed posts
        if: steps.sync.outputs.changed == 'true'
        env:
          SYNC_PATHS: ${{ steps.sync.outputs.paths }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { stdio: 'inherit' });
          const paths = JSON.parse(process.env.SYNC_PATHS);
          if (!paths.length || paths.some(path => !path.startsWith('src/content/writing/') || path.includes('..') || !path.endsWith('.md'))) {
            throw new Error('Unexpected sync paths');
          }
          git('config', 'user.name', 'github-actions[bot]');
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com');
          git('add', '--', ...paths);
          git('commit', '-m', 'content: sync external posts');
          git('push', 'origin', 'HEAD:main');
          NODE
